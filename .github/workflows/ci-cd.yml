name: CI/CD - Build, Push and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: dheera4610/devops-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: dheera4610/devops-frontend:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name devops-realworld-eks

      - name: Deploy Backend
        run: |
          kubectl set image deployment/backend \
            backend=dheera4610/devops-backend:${{ github.sha }}

      - name: Deploy Frontend
        run: |
          kubectl set image deployment/frontend \
            frontend=dheera4610/devops-frontend:${{ github.sha }}

      - name: Verify Backend rollout
        run: |
          kubectl rollout status deployment/backend --timeout=180s

      - name: Verify Frontend rollout
        run: |
          kubectl rollout status deployment/frontend --timeout=180s
