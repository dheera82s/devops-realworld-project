apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: dheera4610/devops-backend:1.1

          ports:
            - containerPort: 5000

          env:
            - name: MYSQL_HOST
              value: mysql

            - name: MYSQL_USER
              value: appuser

            - name: MYSQL_PASSWORD
              value: apppassword

            - name: MYSQL_DATABASE
              value: devopsdb

---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend

  ports:
    - port: 5000
      targetPort: 5000

  type: ClusterIP